<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum | NeonAuth</title>
    <style>
        :root {
            --bg-color: #080711;
            --card-bg: rgba(18, 17, 33, 0.75);
            --card-border: rgba(138, 75, 255, 0.25);
            --neon-purple: #9d4edd;
            --neon-blue: #00f0ff;
            --text-main: #f0f3fc;
            --text-muted: #8b8ea8;
            --input-bg: rgba(255, 255, 255, 0.04);
            --input-border: rgba(255, 255, 255, 0.1);
            --error-color: #ff3366;
            --success-color: #00ffaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        .glow-1 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #7928ca, transparent 70%);
            top: -80px;
            left: -80px;
        }

        .glow-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0070f3, transparent 70%);
            bottom: -100px;
            right: -100px;
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 45px 35px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(157, 78, 221, 0.15);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.2), rgba(0, 240, 255, 0.2));
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .brand-logo svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: var(--neon-blue);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .auth-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #d1d5e5;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            width: 20px;
            height: 20px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            transition: stroke 0.3s ease;
        }

        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 14px 16px 14px 48px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.4), inset 0 0 10px rgba(157, 78, 221, 0.1);
        }

        .form-input:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            stroke: var(--neon-purple);
        }

        .btn-submit {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #9d4edd 0%, #0070f3 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.35s ease;
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.35);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(157, 78, 221, 0.7),
                        0 0 40px rgba(0, 240, 255, 0.5);
            background: linear-gradient(135deg, #a855f7 0%, #00b4d8 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .auth-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--neon-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
            transform: translateX(-3px);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-error {
            background: rgba(255, 51, 102, 0.12);
            border: 1px solid var(--error-color);
            color: #ff85a0;
        }

        .alert-success {
            background: rgba(0, 255, 170, 0.12);
            border: 1px solid var(--success-color);
            color: #70ffcf;
        }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="auth-container">
        <div class="auth-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                </svg>
            </div>
            <h1 class="auth-title">Şifremi Unuttum</h1>
            <p class="auth-subtitle">E-posta adresinizi girin, sıfırlama bağlantısını hemen iletelim.</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="forgotForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="email">E-Posta Adresi</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" id="email" class="form-input" placeholder="adiniz@alanadi.com" autocomplete="email">
                </div>
            </div>

            <button type="submit" class="btn-submit">Şifre Sıfırlama Bağlantısı Gönder</button>

            <div class="auth-footer">
                <a href="index.html" class="back-link">
                    <svg viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Giriş sayfasına dön
                </a>
            </div>
        </form>
    </div>

    <script>
        const forgotForm = document.getElementById('forgotForm');
        const emailInput = document.getElementById('email');
        const alertBox = document.getElementById('alertBox');

        function showAlert(msg, isSuccess = false) {
            alertBox.textContent = msg;
            alertBox.className = 'alert-box ' + (isSuccess ? 'alert-success' : 'alert-error');
            alertBox.style.display = 'block';
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        forgotForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();

            if (!email) {
                showAlert('Lütfen kayıtlı e-posta adresinizi giriniz.');
                return;
            }

            if (!validateEmail(email)) {
                showAlert('Geçerli bir e-posta adresi formatı giriniz.');
                return;
            }

            showAlert('Sıfırlama bağlantısı e-posta adresinize gönderildi!', true);
            emailInput.value = '';
        });
    </script>
</body>
</html>
