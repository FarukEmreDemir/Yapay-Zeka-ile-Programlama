<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | NeonAuth</title>
    <style>
        :root {
            --bg-color: #080711;
            --card-bg: rgba(18, 17, 33, 0.75);
            --card-border: rgba(138, 75, 255, 0.25);
            --neon-purple: #9d4edd;
            --neon-blue: #00f0ff;
            --text-main: #f0f3fc;
            --text-muted: #8b8ea8;
            --input-bg: rgba(255, 255, 255, 0.04);
            --input-border: rgba(255, 255, 255, 0.1);
            --error-color: #ff3366;
            --success-color: #00ffaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        .glow-1 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #7928ca, transparent 70%);
            top: -80px;
            left: -80px;
        }

        .glow-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0070f3, transparent 70%);
            bottom: -100px;
            right: -100px;
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 35px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(157, 78, 221, 0.15);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.2), rgba(0, 240, 255, 0.2));
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 16px;
            margin-bottom: 14px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: var(--neon-blue);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .auth-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #d1d5e5;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            transition: stroke 0.3s ease;
        }

        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 12px 42px 12px 46px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.4), inset 0 0 10px rgba(157, 78, 221, 0.1);
        }

        .form-input:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            stroke: var(--neon-purple);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: var(--neon-blue);
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-submit {
            width: 100%;
            padding: 14px 20px;
            margin-top: 10px;
            background: linear-gradient(135deg, #9d4edd 0%, #0070f3 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.35s ease;
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.35);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(157, 78, 221, 0.7),
                        0 0 40px rgba(0, 240, 255, 0.5);
            background: linear-gradient(135deg, #a855f7 0%, #00b4d8 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--neon-purple);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .auth-footer a:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-error {
            background: rgba(255, 51, 102, 0.12);
            border: 1px solid var(--error-color);
            color: #ff85a0;
        }

        .alert-success {
            background: rgba(0, 255, 170, 0.12);
            border: 1px solid var(--success-color);
            color: #70ffcf;
        }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="auth-container">
        <div class="auth-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
            </div>
            <h1 class="auth-title">Hesap Oluştur</h1>
            <p class="auth-subtitle">Neon evrenine katılmak için formu doldurun</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="signupForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="fullname">Ad Soyad</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" id="fullname" class="form-input" placeholder="Ahmet Yılmaz" autocomplete="name">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">E-Posta Adresi</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" id="email" class="form-input" placeholder="adiniz@alanadi.com" autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Şifre</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="toggle-password" data-target="password" title="Şifreyi Göster/Gizle">
                        <svg class="eye-svg" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Şifre Tekrar</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="toggle-password" data-target="confirmPassword" title="Şifreyi Göster/Gizle">
                        <svg class="eye-svg" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Üye Ol</button>

            <div class="auth-footer">
                Zaten bir hesabınız var mı? <a href="index.html">Giriş Yap</a>
            </div>
        </form>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const fullnameInput = document.getElementById('fullname');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const alertBox = document.getElementById('alertBox');
        const toggleButtons = document.querySelectorAll('.toggle-password');

        toggleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                const targetInput = document.getElementById(targetId);
                const eyeSvg = btn.querySelector('.eye-svg');
                const isPassword = targetInput.getAttribute('type') === 'password';

                targetInput.setAttribute('type', isPassword ? 'text' : 'password');
                if (isPassword) {
                    eyeSvg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                } else {
                    eyeSvg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
                }
            });
        });

        function showAlert(msg, isSuccess = false) {
            alertBox.textContent = msg;
            alertBox.className = 'alert-box ' + (isSuccess ? 'alert-success' : 'alert-error');
            alertBox.style.display = 'block';
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const fullname = fullnameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!fullname || !email || !password || !confirmPassword) {
                showAlert('Lütfen tüm alanları eksiksiz doldurunuz.');
                return;
            }

            if (!validateEmail(email)) {
                showAlert('Lütfen geçerli bir e-posta adresi giriniz.');
                return;
            }

            if (password.length < 6) {
                showAlert('Şifre en az 6 karakterden oluşmalıdır.');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Girdiğiniz şifreler birbiriyle uyuşmuyor.');
                return;
            }

            showAlert('Hesabınız başarıyla oluşturuldu! Giriş yapabilirsiniz.', true);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        });
    </script>
</body>
</html>
